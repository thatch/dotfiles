# tmux config

# Let terminal apps such as pi distinguish Shift+Enter, Ctrl+Enter, etc.
# Pi recommends CSI-u extended keys on tmux 3.5+.
set -g extended-keys on
set -gq extended-keys-format csi-u

# Let programs inside tmux set/get the system clipboard via OSC 52.
# This makes `pbcopy`/`pbpaste` work through tmux + ssh when the outer terminal
# allows it (Ghostty: clipboard-write/read).
set -g set-clipboard on
set -g get-clipboard request
set -as terminal-features ',*:clipboard'

# Prefix+u: copy the last long URL visible/recent in the current pane.
# `-J` joins soft-wrapped lines so long URLs survive terminal wrapping.
bind-key u run-shell 'tmux capture-pane -p -J -S -3000 | ~/.local/bin/copy-url-from-pane'
